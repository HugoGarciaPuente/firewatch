<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FireWatch - Acceso</title>
  <!--
    Autocontenido deliberadamente: /static se sitúa tras la validación de sesión,
    por lo que la página de login no puede cargar la hoja de estilos protegida.
    La paleta inferior replica las mismas propiedades personalizadas de style.css.
  -->
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #111827;
      --border-color: #374151;
      --border-light: #1f2937;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --accent-primary: #f97316;
      --accent-primary-hover: #ea580c;
      --risk-extreme: #ef4444;
      --risk-extreme-bg: rgba(239, 68, 68, 0.2);
      --radius-sm: 6px;
      --radius-lg: 16px;
      --shadow-lg: 0 10px 25px -5px rgba(0,0,0,.6), 0 8px 10px -6px rgba(0,0,0,.5);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .login-card {
      width: 380px; padding: 28px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
    }
    .login-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .login-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .form-input {
      width: 100%; padding: 8px 12px;
      background: var(--bg-main); border: 1px solid var(--border-color);
      border-radius: var(--radius-sm); color: var(--text-main);
      font-size: 13px; outline: none;
    }
    .form-input:focus { border-color: var(--accent-primary); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 14px; border-radius: var(--radius-sm); border: 1px solid transparent;
      font-size: 13px; font-weight: 500; cursor: pointer; width: 100%;
      font-family: inherit;
    }
    .btn-primary { background: var(--accent-primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-primary-hover); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .login-error {
      display: none; margin-top: 12px; padding: 9px 11px;
      background: var(--risk-extreme-bg); color: var(--risk-extreme);
      border: 1px solid var(--risk-extreme);
      border-radius: var(--radius-sm); font-size: 12px;
    }
    .login-note { font-size: 11px; color: var(--text-dim); margin-top: 16px; line-height: 1.5; }
  </style>
</head>
<body>
  <form class="login-card" id="login-form" autocomplete="off">
    <h1 class="login-title">&#128293; FireWatch</h1>
    <p class="login-sub">Introduce la API key para acceder al dashboard.</p>

    <div class="form-group">
      <label for="api-key">API key</label>
      <input type="password" id="api-key" class="form-input"
             required autofocus autocomplete="current-password">
    </div>

    <button type="submit" id="btn-login" class="btn btn-primary">Entrar</button>

    <div id="login-error" class="login-error"></div>

    <p class="login-note">
      La key se envia una sola vez y se cambia por una cookie de sesion.
      No se guarda en el navegador.
    </p>
  </form>

  <script>
    const form = document.getElementById('login-form');
    const input = document.getElementById('api-key');
    const errorBox = document.getElementById('login-error');
    const button = document.getElementById('btn-login');

    fetch('/auth/session')
      .then((r) => r.json())
      .then((d) => { if (d.authenticated) location.replace('/dashboard'); })
      .catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      button.disabled = true;
      button.textContent = 'Verificando...';

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'X-API-Key': input.value }
        });

        if (res.ok) {
          input.value = '';               // descartar la clave antes de navegar
          location.replace('/dashboard');
          return;
        }

        errorBox.textContent =
          res.status === 401 ? 'API key incorrecta.' : 'Error inesperado. Intentalo de nuevo.';
        errorBox.style.display = 'block';
        input.select();
      } catch {
        errorBox.textContent = 'No se pudo contactar con el servidor.';
        errorBox.style.display = 'block';
      } finally {
        button.disabled = false;
        button.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
